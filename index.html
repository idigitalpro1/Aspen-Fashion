
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspen Fashion | Doublewide Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@200;400;600&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fcfcfc;
            color: #1a1a1a;
            margin: 0;
            overflow: hidden;
        }

        .font-serif {
            font-family: 'Cormorant Garamond', serif;
        }

        .doublewide-panel {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .aspen-gold {
            color: #c5a059;
        }

        .aspen-bg-gold {
            background-color: #c5a059;
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: rgba(197, 160, 89, 0.5);
            position: absolute;
            top: 0;
            left: 0;
            animation: scan 3s linear infinite;
            z-index: 10;
            display: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .is-scanning .scan-line {
            display: block;
        }

        /* High-end Verdict Box Styles */
        @keyframes verdict-pulse {
            0% { border-color: rgba(197, 160, 89, 0.3); box-shadow: 0 0 10px rgba(197, 160, 89, 0.1); }
            50% { border-color: rgba(197, 160, 89, 0.8); box-shadow: 0 0 25px rgba(197, 160, 89, 0.2); }
            100% { border-color: rgba(197, 160, 89, 0.3); box-shadow: 0 0 10px rgba(197, 160, 89, 0.1); }
        }

        .verdict-box {
            animation: verdict-pulse 5s ease-in-out infinite;
            background: linear-gradient(145deg, #050505 0%, #1a1a1a 100%);
            border-width: 1px;
            position: relative;
            overflow: hidden;
        }

        .verdict-box::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Specialized Animations for YOU GOT THE LOOK */
        @keyframes progress-ind {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .animate-progress-ind {
            animation: progress-ind 2s infinite ease-in-out;
        }

        @keyframes glint {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }
        .animate-glint {
            animation: glint 4s infinite ease-in-out;
        }

        /* Custom scrollbar for high fashion */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #c5a059; border-radius: 10px; }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        /* Cinema hide details on hover */
        .runway-theater-info {
            transition: opacity 0.3s ease;
        }

        iframe {
            background-color: #000;
        }
    </style>
<script type="importmap">
{
  "imports": {

    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>

    <div id="root"></div>
<script type="module" src="/index.tsx"></script>

</html>
